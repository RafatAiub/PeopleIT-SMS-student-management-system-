name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Lets deploy.yml run the same checks before it builds images.
  workflow_call:

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sms_ci_user
          POSTGRES_PASSWORD: sms_ci_pass
          POSTGRES_DB: sms_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_ci_user -d sms_ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Queues, the email budget and rate limits use Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      EMAIL_ENABLED: 'false'
      SMS_ENABLED: 'false'
      DATABASE_URL: postgresql://sms_ci_user:sms_ci_pass@localhost:5432/sms_ci_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_dummy_access_secret_at_least_32_chars_long
      JWT_REFRESH_SECRET: ci_dummy_refresh_secret_at_least_32_chars_long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run backend tests
        run: npm run test --workspace=backend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Site and ZIP-import logic tests
        working-directory: frontend
        run: |
          for t in src/site/__tests__/site-logic.test.ts src/pages/website/import/__tests__/zip-import.test.ts; do
            npx esbuild "$t" --bundle --platform=node --loader:.css=empty --jsx=automatic --log-level=error --outfile="$RUNNER_TEMP/t.cjs"
            node "$RUNNER_TEMP/t.cjs"
          done

      - name: Build frontend
        run: npm run build --workspace=frontend
