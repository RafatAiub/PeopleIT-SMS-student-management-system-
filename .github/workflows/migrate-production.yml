name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm you want to run prisma migrate deploy against PRODUCTION'
        required: true

jobs:
  migrate:
    name: Deploy Prisma migrations to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check confirmation input
        if: ${{ github.event.inputs.confirm != 'migrate' }}
        run: |
          echo "Confirmation input must be exactly 'migrate'. Aborting."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run production migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy
