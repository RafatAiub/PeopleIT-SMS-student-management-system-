# Production stack on the VPS. Images are built by GitHub Actions and pulled
# from GHCR; IMAGE_PREFIX and TAG come from deploy/.env (see deploy.sh).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  api:
    image: ${IMAGE_PREFIX}/api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env.api
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATA_EXPORT_DIR: /app/backend/data/exports
    volumes:
      - api_data:/app/backend/data
    depends_on:
      redis:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${IMAGE_PREFIX}/web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` — reachable only inside this Docker network.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  api_data:
  caddy_data:
  caddy_config:
  redis_data:
