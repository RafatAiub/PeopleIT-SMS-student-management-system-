<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PeopleNIT SMS — Student Management System for schools, colleges and coaching centres. Manage admissions, fees, attendance and more." />
    <meta name="theme-color" content="#393939" />
    <meta property="og:title" content="PeopleNIT SMS" />
    <meta property="og:description" content="Multi-tenant Student Management System" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>PeopleNIT SMS</title>
    <script>
      // Apply the saved theme and language before first paint so light-mode
      // users don't see a dark flash (and vice versa). Mirrors uiStore /
      // localeStore persistence keys; any failure falls back to defaults.
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem('ui-storage') || '{}').state || {};
          var theme = ui.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var loc = JSON.parse(localStorage.getItem('locale-storage') || '{}').state || {};
          if (loc.lang === 'bn') document.documentElement.lang = 'bn';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
